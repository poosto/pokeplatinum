[binaries]
c   = 'clang'
cpp = 'clang++'
ar  = 'ar'

[built-in options]
c_args        = ['-I/opt/homebrew/include']
cpp_args      = ['-I/opt/homebrew/include']
c_link_args   = ['-L/opt/homebrew/lib']
cpp_link_args = ['-L/opt/homebrew/lib']

[host_machine]
system      = 'darwin'
cpu_family  = 'aarch64'
cpu         = 'arm64'
endian      = 'little'
