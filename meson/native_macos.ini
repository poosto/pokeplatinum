[binaries]
c   = 'gcc-14'
cpp = 'g++-14'
ar  = 'ar'

[built-in options]
# The project's buildtype is plain, so without these the game and the C parts
# of the SDK libraries build unoptimized. The extra flags keep GCC from
# optimizing on undefined behavior that decompiled code relies on.
c_args        = ['-I/opt/homebrew/include', '-O2', '-fno-strict-aliasing', '-fwrapv']
cpp_args      = ['-I/opt/homebrew/include', '-O2', '-fno-strict-aliasing', '-fwrapv']
c_link_args   = ['-L/opt/homebrew/lib']
cpp_link_args = ['-L/opt/homebrew/lib']
